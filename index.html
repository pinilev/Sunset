        /**
         * Convert number to Hebrew Gematria letters (1-999)
         */
        function numberToHebrewLetter(num) {
            if (!num || num <= 0) return '';
            const units = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
            const tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
            const hundreds = ["", "ק", "ר", "ש", "ת", "תק", "תר", "תש", "תת", "תתק"];

            let raw = "";
            
            if (num >= 100) {
                let h = Math.floor(num / 100);
                if (h <= 9) raw += hundreds[h];
                num %= 100;
            }
            
            if (num === 15) {
                raw += "טו";
            } else if (num === 16) {
                raw += "טז";
            } else {
                if (num >= 10) {
                    let t = Math.floor(num / 10);
                    raw += tens[t];
                    num %= 10;
                }
                if (num > 0) {
                    raw += units[num];
                }
            }

            if (raw.length === 0) return "";
            if (raw.length === 1) return raw + "'";
            return raw.slice(0, -1) + '"' + raw.slice(-1);
        }

        /**
         * Get formatted Hebrew date string in Hebrew letters
         */
        function getFormattedHebrewDate(date) {
            try {
                const formatterEng = new Intl.DateTimeFormat('en-US-u-ca-hebrew-nu-latn', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                const partsEng = formatterEng.formatToParts(date);
                let dayNum = 1;
                let yearNum = 5785;

                for (const part of partsEng) {
                    if (part.type === 'day') dayNum = parseInt(part.value, 10);
                    if (part.type === 'year') yearNum = parseInt(part.value, 10);
                }

                const formatterHeb = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {
                    month: 'long'
                });
                const monthParts = formatterHeb.formatToParts(date);
                let monthNameHeb = '';
                for (const part of monthParts) {
                    if (part.type === 'month') monthNameHeb = part.value;
                }

                const dayHeb = numberToHebrewLetter(dayNum);
                const yearHeb = numberToHebrewLetter(yearNum % 1000);
                const prefix = monthNameHeb.startsWith('ב') ? '' : 'ב';

                return `${dayHeb} ${prefix}${monthNameHeb} ${yearHeb}`;
            } catch (e) {
                console.error('Error formatting Hebrew date:', e);
                return '';
            }
        }

        /**
         * Fetch current weather from Open-Meteo based on current coordinates
         */
        async function fetchWeather(lat = currentLat, lng = currentLng) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
                if (!response.ok) throw new Error('Weather fetch failed');
                const data = await response.json();
                
                if (data && data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    const humidity = data.current.relative_humidity_2m;
                    const wind = Math.round(data.current.wind_speed_10m);
                    const code = data.current.weather_code;
                    
                    const { desc, icon } = getWeatherInfo(code);
                    
                    document.getElementById('weatherTemp').textContent = `${temp}°C`;
                    document.getElementById('weatherDesc').textContent = desc;
                    document.getElementById('weatherDetails').textContent = `לחות: ${humidity}%`;
                    
                    const iconContainer = document.getElementById('weatherIconContainer');
                    iconContainer.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i>`;
                    lucide.createIcons();
                }
            } catch (err) {
                console.warn('Failed to load weather, using fallback:', err);
                document.getElementById('weatherDesc').textContent = 'לא זמין';
            }
        }

            if (!str) return '';
            return str.replace(/[\u0591-\u05C7]/g, '').trim();

        /**
         * Get upcoming Friday and Saturday relative to a given date
         */
        function getUpcomingShabbatDates(baseDate) {
            const d = new Date(baseDate);
            const day = d.getDay(); // 0 = Sun, 5 = Fri, 6 = Sat
            
            // If it's Saturday (6), target next Friday (+6 days) for the upcoming week
            const daysToFriday = (day === 6) ? 6 : (5 - day + 7) % 7;
            
            const friday = new Date(d);
            friday.setDate(d.getDate() + daysToFriday);
            
            const saturday = new Date(friday);
            saturday.setDate(friday.getDate() + 1);
            
            return { friday, saturday };
        }

        /**
         * Fetch Shabbat Candle Lighting and Parashat Hashavua from Hebcal API with Fallbacks
         */
        async function fetchShabbatAndParasha(lat = currentLat, lng = currentLng, date = selectedDate) {
            const parashaEl = document.getElementById('parashaDisplay');
            const candleEl = document.getElementById('candleLightingTime');

            const isJerusalem = Math.abs(lat - 31.7683) < 0.1 && Math.abs(lng - 35.2137) < 0.1;
            const bOffset = isJerusalem ? 40 : 20;

            const { friday, saturday } = getUpcomingShabbatDates(date);
            const gy = friday.getFullYear();
            const gm = friday.getMonth() + 1;
            const gd = friday.getDate();

            let data = null;

            // Primary Fetch targeting specific Friday/Saturday date
            try {
                const response = await fetch(`https://www.hebcal.com/shabbat?cfg=json&gy=${gy}&gm=${gm}&gd=${gd}&geo=pos&latitude=${lat}&longitude=${lng}&tzid=Asia/Jerusalem&lg=he&b=${bOffset}`);
                if (response.ok) {
                    data = await response.json();
                }
            } catch (err) {
                console.warn('Primary Shabbat fetch failed, trying fallback:', err);
            }

            // Secondary Fetch (Jerusalem Geoname ID fallback)
            if (!data) {
                try {
                    const response = await fetch(`https://www.hebcal.com/shabbat?cfg=json&gy=${gy}&gm=${gm}&gd=${gd}&geonameid=281184&lg=he&b=${bOffset}`);
                    if (response.ok) {
                        data = await response.json();
                    }
                } catch (err) {
                    console.warn('Geonameid Shabbat fetch failed:', err);
                }
            }

            if (data && data.items && data.items.length > 0) {
                let parashaName = '';
                let holidayName = '';
                let candleTimeStr = '';

                for (const item of data.items) {
                    if (item.category === 'parashat') {
                        parashaName = cleanHebrewText(item.hebrew || item.title);
                    } else if (item.category === 'holiday' && !holidayName) {
                        if (item.hebrew) holidayName = cleanHebrewText(item.hebrew);
                    }
                    if (item.category === 'candles' && !candleTimeStr && item.date) {
                        const candleDate = new Date(item.date);
                        candleTimeStr = formatTime(candleDate);
                    }
                }

                const finalParasha = parashaName || holidayName;
                if (finalParasha) {
                    if (finalParasha.startsWith('פרשת') || finalParasha.startsWith('שבת') || finalParasha.startsWith('חג')) {
                        parashaEl.textContent = finalParasha;
                    } else {
                        parashaEl.textContent = `פרשת ${finalParasha}`;
                    }
                }
                
                if (candleTimeStr) {
                    candleEl.textContent = candleTimeStr;
                    return; // Successfully set
                }
            }

            // Fallback to local offline calculation
            calculateShabbatFallback(lat, lng, date);
        }

        /**
         * Calculate astronomical sunrise and sunset using NOAA algorithm
         */
        function calculateSunTimes(date, lat = currentLat, lng = currentLng) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();

            // Solar calculations
            const N1 = Math.floor(275 * month / 9);
            const N2 = Math.floor((month + 9) / 12);
            const N3 = (1 + Math.floor((year - 4 * Math.floor(year / 4) + 2) / 3));
            const N = N1 - (N2 * N3) + day - 30;

            const lngHour = lng / 15;

            // Sunrise calculation
            const tSunrise = N + ((6 - lngHour) / 24);
            const sunTimesRise = computeTimeForSolarZenith(tSunrise, lat, lng, N, 90.833, true, date);

            // Sunset calculation
            const tSunset = N + ((18 - lngHour) / 24);
            const sunTimesSet = computeTimeForSolarZenith(tSunset, lat, lng, N, 90.833, false, date);

            // Civil Dusk calculation (zenith 96°)
            const tDusk = N + ((18.5 - lngHour) / 24);
            const duskTime = computeTimeForSolarZenith(tDusk, lat, lng, N, 96.0, false, date);

            // Solar Noon & Mincha Gedola calculation
            let solarNoon = null;
            let minchaGedola = null;
            if (sunTimesRise && sunTimesSet) {
                const diff = (sunTimesSet.getTime() - sunTimesRise.getTime()) / 2;
                solarNoon = new Date(sunTimesRise.getTime() + diff);

                // Mincha Gedola = Solar Noon + 0.5 Sha'ah Zmanit (Proportional Hour)
                const shaahZmanitMs = (sunTimesSet.getTime() - sunTimesRise.getTime()) / 12;
                minchaGedola = new Date(solarNoon.getTime() + (0.5 * shaahZmanitMs));
            }

            return {
                sunrise: sunTimesRise,
                sunset: sunTimesSet,
                dusk: duskTime,
                solarNoon: solarNoon,
                minchaGedola: minchaGedola
            };
        }

        function computeTimeForSolarZenith(t, lat, lng, N, zenith, isSunrise, date) {
            const M = (0.9856 * t) - 3.289;

            let L = M + (1.916 * Math.sin(M * Math.PI / 180)) + (0.020 * Math.sin(2 * M * Math.PI / 180)) + 282.634;
            L = (L + 360) % 360;

            let RA = Math.atan(0.91764 * Math.tan(L * Math.PI / 180)) * (180 / Math.PI);
            RA = (RA + 360) % 360;

            const Lquadrant = (Math.floor(L / 90)) * 90;
            const RAquadrant = (Math.floor(RA / 90)) * 90;
            RA = RA + (Lquadrant - RAquadrant);
            RA = RA / 15;

            const sinDec = 0.39782 * Math.sin(L * Math.PI / 180);
            const cosDec = Math.cos(Math.asin(sinDec));

            const cosH = (Math.cos(zenith * Math.PI / 180) - (sinDec * Math.sin(lat * Math.PI / 180))) / (cosDec * Math.cos(lat * Math.PI / 180));

            if (cosH > 1 || cosH < -1) {
                return null;
            }

            let H = isSunrise ? (360 - Math.acos(cosH) * (180 / Math.PI)) : Math.acos(cosH) * (180 / Math.PI);
            H = H / 15;

            const T = H + RA - (0.06571 * t) - 6.622;

            let UT = T - (lng / 15);
            UT = (UT + 24) % 24;

            const targetDateStr = date.toISOString().split('T')[0];
            const sampleLocal = new Date(`${targetDateStr}T12:00:00`);
            const tzOffsetHours = -sampleLocal.getTimezoneOffset() / 60;

            const finalDate = new Date(date);
            finalDate.setHours(Math.floor(UT + tzOffsetHours) % 24);
            finalDate.setMinutes(Math.floor(((UT + tzOffsetHours) % 1) * 60));
            finalDate.setSeconds(Math.floor(((((UT + tzOffsetHours) % 1) * 60) % 1) * 60));

            return finalDate;
        }

        // Format helpers
        function formatTime(date) {
            if (!date) return '--:--';
            return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatDateHebrew(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let gregorianStr = date.toLocaleDateString('he-IL', options);
            
            // Replace "יום שבת" with "שבת"
            gregorianStr = gregorianStr.replace('יום שבת', 'שבת');

            // Calculate Hebrew calendar date formatted purely in Hebrew letters
            const hebrewDateStr = getFormattedHebrewDate(date);

            // Format input date YYYY-MM-DD
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            document.getElementById('datePicker').value = `${yyyy}-${mm}-${dd}`;

            return `${hebrewDateStr} • ${gregorianStr}`;
        }

        // Live App Render Function
        function updateDisplay() {
            const now = new Date();
            const sunData = calculateSunTimes(selectedDate, currentLat, currentLng);

            // Update Location Text Displays
            document.getElementById('headerLocationName').textContent = currentLocationName;

            // Update Header Date
            document.getElementById('currentDateDisplay').textContent = formatDateHebrew(selectedDate);

            if (!sunData.sunset) {
                document.getElementById('sunsetHeroDisplay').textContent = '--:--';
                document.getElementById('minchaHeroDisplay').textContent = '--:--';
                return;
            }

            // Main Hero Dual Times Display: Mincha Gedola & Sunset (equal height and size)
            document.getElementById('minchaHeroDisplay').textContent = formatTime(sunData.minchaGedola);
            document.getElementById('sunsetHeroDisplay').textContent = formatTime(sunData.sunset);

            // Day length calculation
            if (sunData.sunrise && sunData.sunset) {
                const diffMs = sunData.sunset - sunData.sunrise;
                const hours = Math.floor(diffMs / (1000 * 60 * 60));
                const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('dayLengthDisplay').textContent = `${hours} שעות ו-${minutes} דק'`;
            }

            // Calculate Status & Countdown
            const isToday = selectedDate.toDateString() === now.toDateString();
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');

            if (isToday) {
                const diffMincha = sunData.minchaGedola - now;
                const diffSunset = sunData.sunset - now;

                if (diffMincha > 0) {
                    // Before Mincha Gedola
                    const hours = Math.floor(diffMincha / (1000 * 60 * 60));
                    const minutes = Math.floor((diffMincha % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diffMincha % (1000 * 60)) / 1000);

                    statusText.textContent = `עוד ${hours > 0 ? hours + ' שעות, ' : ''}${minutes} דק' ו-${seconds} שנ' למנחה גדולה`;
                    statusBadge.className = "inline-flex items-center gap-2 px-5 py-2 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-200 text-sm sm:text-base font-medium animate-pulse";
                } else if (diffSunset > 0) {
                    // Between Mincha Gedola and Sunset
                    const hours = Math.floor(diffSunset / (1000 * 60 * 60));
                    const minutes = Math.floor((diffSunset % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diffSunset % (1000 * 60)) / 1000);

                    statusText.textContent = `זמן מנחה! עוד ${hours > 0 ? hours + ' שעות, ' : ''}${minutes} דק' ו-${seconds} שנ' לשקיעה`;
                    statusBadge.className = "inline-flex items-center gap-2 px-5 py-2 rounded-2xl bg-orange-500/20 border border-orange-400 text-orange-200 text-sm sm:text-base font-semibold";
                } else if (Math.abs(diffSunset) <= 3 * 60 * 1000) {
                    // Sunset is happening NOW
                    statusText.textContent = `השקיעה מתרחשת ממש עכשיו! 🌅`;
                    statusBadge.className = "inline-flex items-center gap-2 px-5 py-2 rounded-2xl bg-orange-600/30 border border-orange-400 text-orange-200 text-sm sm:text-base font-bold shadow-lg shadow-orange-500/20";
                } else {
                    // Sunset already passed today
                    const pastMs = Math.abs(diffSunset);
                    const hours = Math.floor(pastMs / (1000 * 60 * 60));
                    const minutes = Math.floor((pastMs % (1000 * 60 * 60)) / (1000 * 60));

                    statusText.textContent = `השקיעה הייתה לפני ${hours > 0 ? hours + ' שעות ו-' : ''}${minutes} דקות`;
                    statusBadge.className = "inline-flex items-center gap-2 px-5 py-2 rounded-2xl bg-purple-900/30 border border-purple-500/30 text-purple-200 text-sm sm:text-base font-medium";
                }
            } else {
                // Different Date selected
                const isFuture = selectedDate > now;
                statusText.textContent = isFuture ? 'זמן עתידי' : 'זמן עבור תאריך שעבר';
                statusBadge.className = "inline-flex items-center gap-2 px-5 py-2 rounded-2xl bg-white/5 border border-white/10 text-gray-300 text-sm sm:text-base font-medium";
            }
        }

                async (position) => {

                    // Reverse geocode location name
                    currentLocationName = await fetchLocationName(currentLat, currentLng);

                (error) => {
                    console.error('Geolocation error:', error);
                    btnText.textContent = 'שגיאה באיתור';
                    setTimeout(() => { btnText.textContent = 'מיקום לפי GPS'; }, 3000);
                },
                { timeout: 10000, enableHighAccuracy: true }

        function initCanvasAnimation() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // Particles representing gentle twilight atmosphere embers
            const particles = Array.from({ length: 45 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                color: ['rgba(245, 146, 77, ', 'rgba(251, 191, 36, ', 'rgba(227, 84, 24, '][Math.floor(Math.random() * 3)],
                alpha: Math.random() * 0.6 + 0.1,
                speedY: -(Math.random() * 0.4 + 0.1),
                pulse: Math.random() * 0.02
            }));

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    p.y += p.speedY;
                    if (p.y < -10) {
                        p.y = canvas.height + 10;
                        p.x = Math.random() * canvas.width;
                    }

                    p.alpha += Math.sin(Date.now() * 0.002) * p.pulse;
                    const alpha = Math.max(0.1, Math.min(0.7, p.alpha));

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `${p.color}${alpha})`;
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();
        }

            initCanvasAnimation();
            updateDisplay();
            fetchWeather(currentLat, currentLng);
            fetchShabbatAndParasha(currentLat, currentLng, selectedDate);

            // Real-time update ticker every second
            setInterval(updateDisplay, 1000);
            
            // Refresh weather every 10 minutes
            setInterval(() => fetchWeather(currentLat, currentLng), 600000);
        };
    </script>
</body>
</html>
